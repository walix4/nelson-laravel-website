<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Crown loop at top -->
  <ellipse cx="256" cy="62" rx="30" ry="24" fill="none" stroke="#fc0b05" strokeWidth="24"/>
  <!-- Stem -->
  <rect x="236" y="80" width="40" height="32" rx="4" fill="#fc0b05"/>
  <!-- Left button -->
  <rect x="38" y="196" width="36" height="20" rx="10" fill="#fc0b05"/>
  <!-- Right button -->
  <rect x="438" y="196" width="36" height="20" rx="10" fill="#fc0b05"/>
  <!-- Outer red body -->
  <circle cx="256" cy="300" r="198" fill="#fc0b05"/>
  <!-- White face -->
  <circle cx="256" cy="300" r="152" fill="white"/>
  <!-- Tick marks: 12 positions, rotate around face center (256,300) -->
  <!-- Major at 0° 90° 180° 270° -->
  <rect x="248" y="156" width="16" height="26" rx="4" fill="#fc0b05"/>
  <rect x="248" y="156" width="16" height="26" rx="4" fill="#fc0b05" transform="rotate(90 256 300)"/>
  <rect x="248" y="156" width="16" height="26" rx="4" fill="#fc0b05" transform="rotate(180 256 300)"/>
  <rect x="248" y="156" width="16" height="26" rx="4" fill="#fc0b05" transform="rotate(270 256 300)"/>
  <!-- Minor ticks -->
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(30 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(60 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(120 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(150 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(210 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(240 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(300 256 300)"/>
  <rect x="250" y="158" width="12" height="16" rx="3" fill="#fc0b05" transform="rotate(330 256 300)"/>
  <!-- Clock hand (navy, ~320° → pointing upper-left like the reference) -->
  <line x1="256" y1="300" x2="182" y2="198" stroke="#08192b" strokeWidth="24" strokeLinecap="round" transform="rotate(-20 256 300)"/>
  <!-- Center pivot -->
  <circle cx="256" cy="300" r="16" fill="#08192b"/>
</svg>
